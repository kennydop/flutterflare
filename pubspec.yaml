name: flutterflare
description: "A production-ready Flutter boilerplate with Firebase integration"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.7.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  ## Firebase
  firebase_core: ^3.11.0
  firebase_auth: ^5.4.2
  cloud_firestore: ^5.6.5
  firebase_crashlytics: ^4.3.2
  firebase_analytics: ^11.4.2
  firebase_messaging: ^15.2.2
  firebase_remote_config: ^5.4.0
  cloud_functions: ^5.3.2

  # Auth Providers
  google_sign_in: ^6.3.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.0

  # Code Generation
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Icons
  cupertino_icons: ^1.0.8
  iconify_flutter_plus: ^1.0.4
  colorful_iconify_flutter: ^0.0.5

  # UI Components
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  toastification: ^2.3.0
  lottie: ^3.3.1

  # Utils
  hive_ce: ^2.10.1
  connectivity_plus: ^6.1.3
  intl: ^0.20.2
  flutter_native_splash: ^2.4.4
  logger: ^2.5.0
  collection: ^1.19.0
  crypto: ^3.0.3

  # Search
  algoliasearch: ^1.29.0

  # Environment
  envied: ^1.1.1
  path_provider: ^2.1.5
  device_info_plus: ^11.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Launcher Icons
  flutter_launcher_icons: ^0.14.3

  # Code Generation
  build_runner: ^2.4.15
  freezed: ^3.0.3
  riverpod_generator: ^2.6.5
  json_serializable: ^6.9.4
  hive_ce_generator: ^1.8.2
  envied_generator: ^1.1.1

  # Lints
  flutter_lints: ^4.0.0
  riverpod_lint: ^2.6.4
  custom_lint: ^0.7.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist/Urbanist-Thin.ttf
          weight: 100
        - asset: assets/fonts/Urbanist/Urbanist-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Urbanist/Urbanist-Light.ttf
          weight: 300
        - asset: assets/fonts/Urbanist/Urbanist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Urbanist/Urbanist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Urbanist/Urbanist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Urbanist/Urbanist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Urbanist/Urbanist-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Urbanist/Urbanist-Black.ttf
          weight: 900
        - asset: assets/fonts/Urbanist/Urbanist-Italic.ttf
          weight: 400
          style: italic

    - family: DelaGothicOne
      fonts:
        - asset: assets/fonts/DelaGothicOne/DelaGothicOne-Regular.ttf
