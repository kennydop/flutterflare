flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/prod/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icons/prod/ic_launcher_background.png" # only available for Android 8.0 devices and above
  adaptive_icon_foreground: "assets/icons/prod/ic_launcher_foreground.png" # only available for Android 8.0 devices and above
  adaptive_icon_monochrome: "assets/icons/prod/ic_launcher_foreground.png" # only available for Android 13 devices and above
  background_color_ios: "#ffffff"
